; Умолчания пула. Рассчитаны на сайт под средней нагрузкой (десятки запросов
; в минуту, всплески во время рекламы или акций), но на локалке почти ничего
; не едят: в простое fpm держит 2–5 воркеров.
;
; Перекрываются переменными PHP_FPM_* (docker-entrypoint.sh пишет их в
; zz-env.conf) или своим конфигом, имя которого идёт по алфавиту позже.

[global]
; В официальном образе 0: при перезагрузке (USR2) запросы на лету обрываются
process_control_timeout = 10s
; Воркеры раз за разом падают с сегфолтом (обычно это расширение) — лучше
; перезапустить fpm целиком, чем бесконечно плодить падающих
emergency_restart_threshold = 10
emergency_restart_interval = 1m

[www]
pm = dynamic
; В официальном образе 5, а это впритык: пара долгих запросов (импорт, обход
; карты сайта, медленный внешний API) — и посетителям почти ничего не
; остаётся. Под нагрузкой воркер занимает 50–80 МБ, так что 12 — это около
; 1 ГБ в пике, а в простое лишние воркеры гасятся
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
; Чтобы утечки в расширениях (imagick, gd) не копились неделями
pm.max_requests = 500

; Без php.ini log_errors выключен, и показанная в браузере ошибка больше
; нигде не остаётся. Пишем всегда: в docker logs или в PHP_ERROR_LOG.
; Здесь, а не в ini, чтобы CLI не дублировал каждую ошибку в stderr
php_flag[log_errors] = on
