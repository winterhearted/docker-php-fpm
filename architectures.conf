# Архитектуры, из которых stitch.sh собирает мультиарх-манифесты.
# Одна на строку, "#" — комментарий. Строка должна совпадать с суффиксом, под
# которым арх-теги пушатся (его выдаёт eng_arch в engine.sh: amd64/arm64/riscv64).
#
# Это список того, что склеивать, а не того, что собирать: архитектура может
# собираться где угодно (GitHub Actions, свой сервер), stitch.sh просто берёт
# из реестра те её теги, что там есть. Что собирает CI — см. ARCHES и матрицы
# в .github/workflows/.

amd64
arm64
riscv64
