# Архитектуры, из которых stitch.sh собирает мультиарх-манифесты.
# Одна на строку, "#" — комментарий. Суффикс архитектуры (amd64/arm64/riscv64
# и т.п.) берётся из `docker version --format '{{.Server.Arch}}'` на машине,
# которая пушит свои арх-теги (build.sh/push.sh/backfill.sh), и должен
# совпадать со строкой здесь.
#
# Этот файл нужно синхронизировать на все машины, участвующие в сборке
# (amd64, arm64, riscv64-хосты) — иначе stitch.sh на одной машине не будет
# знать про архитектуры, тег которых ещё не появился локально.

amd64
arm64
riscv64
