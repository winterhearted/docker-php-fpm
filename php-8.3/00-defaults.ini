; Умолчания образа. Файл грузится первым, поэтому переменные PHP_* и свои ini
; в conf.d его перекрывают.

; Не светить версию PHP в заголовке X-Powered-By
expose_php = Off

; Фреймворкам с composer штатных 8 МБ не хватает. Буфер забивается, и
; дальше каждый воркер держит свою копию строк
opcache.interned_strings_buffer = 16
; 10000 файлов — это пара крупных пакетов в vendor/, остальное opcache
; молча перестаёт кэшировать. Слот в таблице стоит копейки
opcache.max_accelerated_files = 20000
